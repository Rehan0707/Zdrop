<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 197 218" width="100%" height="100%" fill="none">
  <defs>
    <!-- Vinyl Sticker Tactile Drop Shadows -->
    <filter id="zd-sticker-shadow" x="-25%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.16" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.10" />
    </filter>

    <!-- Glossy Vinyl Sticker Sheen -->
    <linearGradient id="zd-sticker-sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="zd-green-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02c85e" />
      <stop offset="100%" stop-color="#00ba57" />
    </linearGradient>
  </defs>

  <g filter="url(#zd-sticker-shadow)">
    <!-- White Die-Cut Vinyl Sticker Border -->
    <path
      d="M 147,14 L 149,14 L 182,48 L 183,50 L 181,52 L 150,52 L 146,48 L 145,45 L 145,16 L 147,14 Z"
      fill="#ffffff"
      stroke="#ffffff"
      stroke-width="14"
      stroke-linejoin="round"
      stroke-linecap="round"
    />
    <path
      d="M 36,16 L 132,16 L 132,58 L 133,59 L 144,59 L 147,61 L 168,61 L 150,79 L 126,99 L 102,117 L 74,136 L 75,138 L 153,138 L 155,142 L 155,159 L 154,160 L 155,167 L 156,168 L 173,168 L 174,172 L 144,203 L 142,204 L 138,201 L 113,174 L 22,174 L 15,169 L 14,166 L 14,147 L 17,139 L 21,134 L 70,90 L 73,86 L 106,55 L 103,53 L 29,53 L 27,52 L 23,48 L 23,25 L 27,20 L 36,16 Z"
      fill="#ffffff"
      stroke="#ffffff"
      stroke-width="14"
      stroke-linejoin="round"
      stroke-linecap="round"
    />

    <!-- Main Green Logo Body -->
    <path
      d="M 147,14 L 149,14 L 182,48 L 183,50 L 181,52 L 150,52 L 146,48 L 145,45 L 145,16 L 147,14 Z"
      fill="url(#zd-green-gradient)"
      stroke="#00ba57"
      stroke-width="2"
      stroke-linejoin="round"
    />
    <path
      d="M 36,16 L 132,16 L 132,58 L 133,59 L 144,59 L 147,61 L 168,61 L 150,79 L 126,99 L 102,117 L 74,136 L 75,138 L 153,138 L 155,142 L 155,159 L 154,160 L 155,167 L 156,168 L 173,168 L 174,172 L 144,203 L 142,204 L 138,201 L 113,174 L 22,174 L 15,169 L 14,166 L 14,147 L 17,139 L 21,134 L 70,90 L 73,86 L 106,55 L 103,53 L 29,53 L 27,52 L 23,48 L 23,25 L 27,20 L 36,16 Z"
      fill="url(#zd-green-gradient)"
      stroke="#00ba57"
      stroke-width="2"
      stroke-linejoin="round"
    />

    <!-- Subtle Vinyl Sheen Layer -->
    <path
      d="M 36,16 L 132,16 L 132,58 L 133,59 L 144,59 L 147,61 L 168,61 L 150,79 L 126,99 L 102,117 L 74,136 L 75,138 L 153,138 L 155,142 L 155,159 L 154,160 L 155,167 L 156,168 L 173,168 L 174,172 L 144,203 L 142,204 L 138,201 L 113,174 L 22,174 L 15,169 L 14,166 L 14,147 L 17,139 L 21,134 L 70,90 L 73,86 L 106,55 L 103,53 L 29,53 L 27,52 L 23,48 L 23,25 L 27,20 L 36,16 Z"
      fill="url(#zd-sticker-sheen)"
      pointer-events="none"
    />
  </g>
</svg>
